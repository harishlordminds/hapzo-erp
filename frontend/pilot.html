<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAPZO Decaste ERP</title>
<style>
*{box-sizing:border-box}:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#172b25;background:#f4f6f2;--green:#0b6248;--deep:#123e32;--muted:#62766d;--line:#dbe5de;--paper:#fffefb;--amber:#fff2d7;--red:#fce8e4}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,p{margin:0}p{line-height:1.5}small,.muted{color:var(--muted)}.app{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}aside{background:var(--deep);color:#f2f6ef;padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.mark{height:38px;width:38px;display:grid;place-items:center;background:#c5eed0;color:var(--deep);border-radius:11px;font-weight:900;font-size:20px}.brand strong{display:block;letter-spacing:.09em}.brand small{color:#b7d3c6}nav{display:grid;gap:4px}nav button{border:0;border-radius:8px;padding:9px 11px;background:transparent;color:#c9dacf;text-align:left;font-weight:600}nav button:hover,nav button[aria-current=page]{background:#23634e;color:#fff}.nav-label{padding:8px 11px 3px;color:#8eb09f;font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.aside-foot{margin-top:auto;padding:0 10px;color:#a9c5b6;font-size:11px;line-height:1.6}main{min-width:0}header{height:62px;background:#fff;border-bottom:1px solid var(--line);padding:0 clamp(18px,3vw,44px);display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:3}header strong{font-size:14px}.badge{display:inline-flex;align-items:center;border-radius:99px;padding:4px 9px;background:#e3f1e7;color:#155b41;font-size:11px;font-weight:750;white-space:nowrap}.badge.warn{background:var(--amber);color:#805613}.badge.danger{background:var(--red);color:#9a392b}.content{padding:28px clamp(18px,3vw,44px) 60px;max-width:1600px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.heading h1{font-size:clamp(25px,3vw,36px);letter-spacing:-.045em}.heading p{color:var(--muted);margin-top:5px;max-width:920px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.card small{font-size:12px}.card strong{display:block;margin-top:7px;color:var(--green);font-size:27px;letter-spacing:-.04em}.panel{margin-bottom:14px}.panel h2{font-size:16px;margin-bottom:11px;letter-spacing:-.02em}.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}.table{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.035em}tr:last-child td{border-bottom:0}.empty{padding:14px 0;color:var(--muted);font-size:13px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}form{display:grid;gap:10px}label{display:grid;gap:4px;font-size:12px;font-weight:700;color:#31473d}input,select,textarea{width:100%;min-width:0;background:#fff;border:1px solid #becdc4;color:#1d3329;border-radius:7px;padding:8px 9px;font-size:13px}textarea{min-height:74px;resize:vertical}input[type=checkbox]{width:auto}.button{display:inline-flex;justify-content:center;align-items:center;justify-self:start;border:1px solid var(--green);border-radius:7px;background:var(--green);color:#fff;padding:8px 12px;font-size:12px;font-weight:750}.button.secondary{background:white;color:var(--green)}.button.danger{background:#fff;color:#9a392b;border-color:#dba89d}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.inline{border:0;background:none;color:var(--green);text-decoration:underline;font-weight:750;padding:0;text-align:left}.note{padding:10px 12px;background:#edf4ed;border-radius:8px;color:#3b5c4b;font-size:12px;line-height:1.5;margin:9px 0}.alert{background:var(--amber);color:#735016}.notice{position:sticky;top:62px;z-index:2}.notice:not(:empty){padding:10px 18px;background:#e0f2e4;border-bottom:1px solid #9fc8aa;font-size:13px}.notice.error{background:#ffebe6;border-color:#dca99b;color:#7d2a1d}.progress{height:7px;border-radius:9px;background:#e4ebe6;overflow:hidden;margin-top:6px}.progress span{display:block;height:100%;background:#16916b}.subtle{font-size:11px;color:var(--muted);line-height:1.5}.scroll-card{max-height:450px;overflow:auto}.trace-node{padding:9px 10px;border-left:3px solid #82b49a;background:#f3f7f3;margin:5px 0;border-radius:0 7px 7px 0;font-size:12px}.dpp-table input,.dpp-table select{font-size:11px;padding:5px}.dpp-table td{padding:5px 6px}.hide{display:none!important}@media(max-width:1050px){.split{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.app{display:block}aside{padding:11px 9px;gap:9px}.brand{padding:0 6px}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;font-size:12px}.nav-label{display:none}.aside-foot{display:none}header{height:54px;position:static}.content{padding-top:18px}.fields{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.notice{top:0}}@media print{aside,header,.notice,.actions,form{display:none!important}.app{display:block}.content{padding:0}.panel,.card{break-inside:avoid}}
</style></head><body>
<div class="app"><aside><div class="brand"><span class="mark">H</span><div><strong>HAPZO</strong><small>Decaste · ERP + DPP</small></div></div><nav id="nav" aria-label="ERP modules"></nav><div class="aside-foot">Local ERP workspace<br>Records stay in this browser. Export backups from Settings.</div></aside><main><header><strong>HAPZO Decaste / Operations Workspace</strong><span class="badge" id="saveState">Local data</span></header><div id="notice" class="notice" role="status" aria-live="polite"></div><div id="content" class="content"></div></main></div>
